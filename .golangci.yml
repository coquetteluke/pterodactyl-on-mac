version: "2"

# This fork builds for darwin and linux; lint both (see `make lint`) so the
# _darwin, _linux and _unix files are all type-checked and linted.

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors, already reported by errcheck
        - G115 # integer overflow on conversion, too noisy for stat/syscall code
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
      # Explicit embedded-field selectors (e.g. f.File.Seek in a wrapper type)
      # are kept on purpose.
      - linters:
          - staticcheck
        text: "QF1008:"
      # darwin has no procfs, so process accounting and descriptor paths go
      # through proc_info(2) and fcntl(F_GETPATH) directly. Those calls take
      # pointers; that is all these two files use unsafe for.
      - path: (environment/native/procinfo_darwin|internal/ufs/fdpath_darwin)\.go
        linters:
          - gosec
        text: "G103:"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
