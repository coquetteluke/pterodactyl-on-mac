name: Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.goos }}/${{ matrix.goarch }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # darwin is the point of this fork, and linux is here to prove the port did
      # not regress the platform everyone else runs on. Both must stay green.
      matrix:
        include:
          - { os: macos-15, goos: darwin, goarch: amd64, go: "1.26.11" }
          - { os: macos-15, goos: darwin, goarch: arm64, go: "1.26.11" }
          - { os: ubuntu-24.04, goos: linux, goarch: amd64, go: "1.26.11" }
          - { os: ubuntu-24.04, goos: linux, goarch: arm64, go: "1.26.11" }
          # Releases are built with Go 1.26, the last line that runs on macOS
          # 12. These two prove the tree is ready for the next one, on the
          # newest macOS image, without publishing anything built with it.
          - { os: macos-26, goos: darwin, goarch: arm64, go: "1.27.4" }
          - { os: ubuntu-24.04, goos: linux, goarch: amd64, go: "1.27.4" }
    permissions:
      contents: read
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: go mod download
        env:
          CGO_ENABLED: 0
        run: |
          go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          SRC_PATH: github.com/pterodactyl/wings
        run: |
          go build -v -trimpath -ldflags="-s -w -X ${SRC_PATH}/system.Version=dev-${GITHUB_SHA:0:7}" -o dist/wings ${SRC_PATH}
          go build -v -trimpath -ldflags="-X ${SRC_PATH}/system.Version=dev-${GITHUB_SHA:0:7}" -o dist/wings_debug ${SRC_PATH}
          chmod 755 dist/*

      # Tests only run where the runner's own architecture matches the target,
      # since a cross-compiled binary cannot be executed here. GitHub's macOS
      # runners are arm64; the Linux ones are amd64.
      - name: go test
        if: ${{ (matrix.goos == 'linux' && matrix.goarch == 'amd64') || (matrix.goos == 'darwin' && matrix.goarch == 'arm64') }}
        env:
          CGO_ENABLED: 0
        run: |
          go test $(go list ./...)

      - name: go test -race
        if: ${{ (matrix.goos == 'linux' && matrix.goarch == 'amd64') || (matrix.goos == 'darwin' && matrix.goarch == 'arm64') }}
        env:
          CGO_ENABLED: 1
        run: |
          go test -race $(go list ./...)

      # Per-server accounts can only be exercised as root, since dropping a
      # process to another user is a privileged operation. Without this the
      # isolation test silently skips and the feature is never actually proven.
      - name: go test (privileged)
        if: ${{ matrix.goos == 'darwin' && matrix.goarch == 'arm64' }}
        env:
          CGO_ENABLED: 0
        run: |
          go test -c -o /tmp/native.test ./environment/native/
          sudo /tmp/native.test -test.run 'DedicatedAccount' -test.v
          # pfctl will not parse a ruleset without root, so the check that the
          # generated firewall policy is valid pf never runs above either.
          go test -c -o /tmp/netiso.test ./internal/netiso/
          sudo /tmp/netiso.test -test.run 'GeneratedRulesetParses' -test.v

      - name: Upload Release Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && matrix.go == '1.26.11' }}
        with:
          name: wings_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/wings

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && matrix.go == '1.26.11' }}
        with:
          name: wings_${{ matrix.goos }}_${{ matrix.goarch }}_debug
          path: dist/wings_debug
