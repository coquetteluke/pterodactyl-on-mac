name: Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # darwin is the point of this fork, and linux is here to prove the port did
      # not regress the platform everyone else runs on. Both must stay green.
      matrix:
        include:
          - { os: macos-15, goos: darwin, goarch: amd64, go: "1.25.5" }
          - { os: macos-15, goos: darwin, goarch: arm64, go: "1.25.5" }
          - { os: ubuntu-24.04, goos: linux, goarch: amd64, go: "1.25.5" }
          - { os: ubuntu-24.04, goos: linux, goarch: arm64, go: "1.25.5" }
    permissions:
      contents: read
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ matrix.go }}

      - name: go mod download
        env:
          CGO_ENABLED: 0
        run: |
          go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          SRC_PATH: github.com/pterodactyl/wings
        run: |
          go build -v -trimpath -ldflags="-s -w -X ${SRC_PATH}/system.Version=dev-${GITHUB_SHA:0:7}" -o dist/wings ${SRC_PATH}
          go build -v -trimpath -ldflags="-X ${SRC_PATH}/system.Version=dev-${GITHUB_SHA:0:7}" -o dist/wings_debug ${SRC_PATH}
          chmod 755 dist/*

      # Tests only run where the runner's own architecture matches the target,
      # since a cross-compiled binary cannot be executed here. GitHub's macOS
      # runners are arm64; the Linux ones are amd64.
      - name: go test
        if: ${{ (matrix.goos == 'linux' && matrix.goarch == 'amd64') || (matrix.goos == 'darwin' && matrix.goarch == 'arm64') }}
        env:
          CGO_ENABLED: 0
        run: |
          go test $(go list ./...)

      - name: go test -race
        if: ${{ (matrix.goos == 'linux' && matrix.goarch == 'amd64') || (matrix.goos == 'darwin' && matrix.goarch == 'arm64') }}
        env:
          CGO_ENABLED: 1
        run: |
          go test -race $(go list ./...)

      # Per-server accounts can only be exercised as root, since dropping a
      # process to another user is a privileged operation. Without this the
      # isolation test silently skips and the feature is never actually proven.
      - name: go test (privileged)
        if: ${{ matrix.goos == 'darwin' && matrix.goarch == 'arm64' }}
        env:
          CGO_ENABLED: 0
        run: |
          go test -c -o /tmp/native.test ./environment/native/
          sudo /tmp/native.test -test.run 'DedicatedAccount' -test.v

      - name: Upload Release Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
        with:
          name: wings_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/wings

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
        with:
          name: wings_${{ matrix.goos }}_${{ matrix.goarch }}_debug
          path: dist/wings_debug
