name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS binaries
    runs-on: macos-15
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.25.5"

      - name: Build
        env:
          CGO_ENABLED: 0
          SRC_PATH: github.com/pterodactyl/wings
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH="$arch" go build -v -trimpath \
              -ldflags "-s -w -X ${SRC_PATH}/system.Version=${version}" \
              -o "dist/wings_darwin_${arch}" "${SRC_PATH}"
          done
          chmod 755 dist/*

      # Published so anyone can verify a downloaded binary matches this build.
      - name: Checksums
        run: |
          cd dist
          shasum -a 256 wings_darwin_* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The notes live in .github/RELEASE_NOTES.md rather than inline here, so
          # they are reviewed alongside the code they describe. Baked into this
          # workflow they silently went stale: they still called isolation
          # opt-in for several releases after it became the default.
          cp .github/RELEASE_NOTES.md /tmp/notes.md
          sed -i '' "s|__REPO__|${GITHUB_REPOSITORY}|g" /tmp/notes.md

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            dist/wings_darwin_amd64 \
            dist/wings_darwin_arm64 \
            dist/SHA256SUMS
