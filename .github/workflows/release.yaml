name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS binaries
    runs-on: macos-15
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.25.5"

      - name: Build
        env:
          CGO_ENABLED: 0
          SRC_PATH: github.com/pterodactyl/wings
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH="$arch" go build -v -trimpath \
              -ldflags "-s -w -X ${SRC_PATH}/system.Version=${version}" \
              -o "dist/wings_darwin_${arch}" "${SRC_PATH}"
          done
          chmod 755 dist/*

      # Published so anyone can verify a downloaded binary matches this build.
      - name: Checksums
        run: |
          cd dist
          shasum -a 256 wings_darwin_* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Written to a file rather than passed inline: the notes contain
          # backticks and $-signs that would otherwise need escaping twice, once
          # for YAML and once for the shell.
          cat > /tmp/notes.md <<'NOTES'
          Unofficial macOS build of Pterodactyl Wings, which runs game servers as
          host processes because macOS cannot run Linux containers.

          ## Which one do I want?

          **Just this Mac as a node.** You already have a Panel somewhere else, on a
          Raspberry Pi or another machine on your network, and you want this Mac to
          run game servers for it. This installs only the daemon.

          ```
          curl -fsSL https://raw.githubusercontent.com/__REPO__/main/install.sh | bash
          ```

          Then create a node in your existing Panel and paste its config onto this
          Mac. Set the node's **Daemon Port to 8443**, not 443, because an unprivileged
          process cannot bind a port below 1024.

          **Everything on one Mac.** You have no Panel yet and want the whole thing
          on this machine. This additionally installs PHP, MariaDB and nginx via
          Homebrew, sets up the Panel and its database, and creates an admin
          account. The Panel ends up on `http://<your-mac>.local:8088`, with the
          generated passwords written to `CREDENTIALS.txt`.

          ```
          curl -fsSL https://raw.githubusercontent.com/__REPO__/main/install.sh | bash -s -- --full
          ```

          Add `-s -- --launchagent` to either one to also install a LaunchAgent so
          wings starts at login.

          ## Or install by hand

          Download the binary for your Mac below, `arm64` for Apple silicon or
          `amd64` for Intel, and check it against `SHA256SUMS`:

          ```
          shasum -a 256 -c SHA256SUMS --ignore-missing
          ```

          ## Before you deploy it

          This fork has no containers, so it also has none of the isolation
          containers provide. By default every server runs as the same user and can
          read every other server's files, and CPU limits are not enforced at all.
          **Do not use this for shared or multi-tenant hosting.** See the README for
          what can and cannot be mitigated.
          NOTES
          sed -i '' "s|__REPO__|${GITHUB_REPOSITORY}|g" /tmp/notes.md

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            dist/wings_darwin_amd64 \
            dist/wings_darwin_arm64 \
            dist/SHA256SUMS
